name: cumnange_dei
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.2.1
  get: ^4.7.3
  http: ^1.6.0
  get_storage: ^2.1.1
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  google_generative_ai: ^0.4.0
  string_similarity: ^2.1.0
  pdf: ^3.12.0
  printing: ^5.14.3
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.7
  flutter_html: ^3.0.0-beta.2
  webview_flutter: ^4.10.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/image/book.png"

flutter:
  uses-material-design: true

  assets:
    - assets/image/
    - assets/fonts/

  fonts:
    - family: Battambang
      fonts:
        - asset: assets/fonts/Battambang/Battambang-Thin.ttf
          weight: 100
        - asset: assets/fonts/Battambang/Battambang-Light.ttf
          weight: 300
        - asset: assets/fonts/Battambang/Battambang-Regular.ttf
          weight: 400
        - asset: assets/fonts/Battambang/Battambang-Bold.ttf
          weight: 700
        - asset: assets/fonts/Battambang/Battambang-Black.ttf
          weight: 900